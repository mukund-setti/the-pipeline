<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline · Option B · Roots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sprout: #53B72A;
    --sprout-deep: #3E9B1F;
    --lime: #A6E17A;
    --lime-soft: #E9F7DB;
    --fern: #1C4A12;
    --paper: #FDFEFA;
    --radius-pill: 999px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Nunito Sans", sans-serif;
    color: var(--fern);
    background:
      radial-gradient(ellipse 70% 45% at 50% 18%, var(--lime-soft) 0%, rgba(233,247,219,0) 70%),
      var(--paper);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- nav ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px clamp(20px, 5vw, 56px);
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--fern);
  }
  .nav-brand svg { width: 26px; height: 28px; }
  .nav-links { display: flex; gap: 4px; }
  .nav-links a {
    text-decoration: none;
    color: var(--fern);
    font-weight: 600;
    font-size: 15px;
    padding: 8px 15px;
    border-radius: var(--radius-pill);
    transition: background 0.18s ease;
  }
  .nav-links a:hover { background: var(--lime-soft); }
  .nav-links a:focus-visible, .btn:focus-visible, .nav-join:focus-visible {
    outline: 3px solid var(--sprout);
    outline-offset: 2px;
  }
  .nav-join {
    font-weight: 700;
    font-size: 15px;
    color: var(--sprout-deep);
    background: transparent;
    border: 2px solid var(--sprout);
    border-radius: var(--radius-pill);
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .nav-join:hover { background: var(--sprout); color: #fff; }

  /* ---------- hero ---------- */
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(28px, 6vh, 72px) 20px 0;
  }
  .eyebrow {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sprout-deep);
    background: var(--lime-soft);
    border-radius: var(--radius-pill);
    padding: 7px 16px;
    margin-bottom: 22px;
  }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(64px, 11vw, 124px);
    line-height: 0.98;
    letter-spacing: -0.03em;
    color: var(--fern);
  }
  h1 .line { color: var(--sprout); }
  .tagline {
    font-size: clamp(16px, 2.2vw, 19px);
    font-weight: 600;
    max-width: 500px;
    margin-top: 18px;
    opacity: 0.85;
  }
  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 30px; }
  .btn {
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 17px;
    border-radius: var(--radius-pill);
    padding: 15px 32px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .btn-join {
    color: #fff;
    background: var(--sprout);
    border: none;
    box-shadow: 0 10px 24px rgba(83, 183, 42, 0.3);
  }
  .btn-join:hover { background: var(--sprout-deep); transform: translateY(-2px); }
  .btn-learn {
    color: var(--fern);
    background: #fff;
    border: 2px solid rgba(28, 74, 18, 0.18);
  }
  .btn-learn:hover { border-color: var(--sprout); color: var(--sprout-deep); transform: translateY(-2px); }

  /* ---------- root network ---------- */
  .roots-wrap {
    width: min(1100px, 100vw);
    margin-top: 8px;
  }
  .roots-wrap svg { width: 100%; height: auto; display: block; }

  .trace {
    fill: none;
    stroke: var(--lime);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: grow 1.1s cubic-bezier(0.6, 0, 0.3, 1) forwards;
  }
  .trace.t2 { animation-delay: 0.25s; }
  .trace.t3 { animation-delay: 0.5s; }
  .trace.t4 { animation-delay: 0.75s; }
  @keyframes grow { to { stroke-dashoffset: 0; } }

  .node { opacity: 0; animation: pop 0.4s ease forwards; }
  .node.n1 { animation-delay: 1.0s; }
  .node.n2 { animation-delay: 1.25s; }
  .node.n3 { animation-delay: 1.5s; }
  .node.n4 { animation-delay: 1.75s; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }

  .chip-rect { fill: #fff; stroke: var(--lime); stroke-width: 2; }
  .chip-text {
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 16px;
    fill: var(--fern);
  }
  .node circle { fill: var(--sprout); }

  @media (max-width: 620px) {
    .nav-links { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .trace { animation: none; stroke-dashoffset: 0; }
    .node { animation: none; opacity: 1; }
    .btn, .nav-join { transition: none; }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-brand">
      <svg viewBox="0 0 120 130">
        <g fill="none" stroke="#A6E17A" stroke-width="7" stroke-linecap="round">
          <path d="M60 78 H106"/><path d="M60 78 V96 L46 112"/><path d="M60 96 L76 106"/><path d="M60 78 L38 90"/>
        </g>
        <g fill="#A6E17A">
          <circle cx="110" cy="78" r="5"/><circle cx="43" cy="115" r="5"/><circle cx="79" cy="108" r="5"/><circle cx="34" cy="92" r="5"/>
        </g>
        <path d="M60 40 V78" fill="none" stroke="#53B72A" stroke-width="11" stroke-linecap="round"/>
        <path d="M60 40 C57 24 48 10 30 5 C32 23 44 36 60 40 Z" fill="#4DAE2A"/>
        <path d="M62 46 C70 33 85 25 103 27 C96 42 80 50 62 46 Z" fill="#8FD460"/>
      </svg>
      The Pipeline
    </div>
    <div class="nav-links">
      <a href="#">About</a>
      <a href="#">Portals</a>
      <a href="#">Opportunities</a>
    </div>
    <button class="nav-join">Join</button>
  </nav>

  <main>
    <span class="eyebrow">UCI · UCLA · UCR</span>
    <h1>Pipe<span class="line">line</span></h1>
    <p class="tagline">Plant yourself here. Our roots reach resume reviews, referrals, and real offers.</p>
    <div class="cta-row">
      <a class="btn btn-join" href="#">Join the Pipeline</a>
      <a class="btn btn-learn" href="#">Learn more</a>
    </div>

    <!-- roots grow out of the CTA and end at what members actually get -->
    <div class="roots-wrap" aria-hidden="true">
      <svg viewBox="0 0 1100 260">
        <path class="trace t1" pathLength="1" d="M550 0 V46 L430 120 H260"/>
        <path class="trace t2" pathLength="1" d="M550 0 V46 L660 120 H830"/>
        <path class="trace t3" pathLength="1" d="M550 0 V90 L470 190 H330"/>
        <path class="trace t4" pathLength="1" d="M550 0 V90 L640 190 H760"/>

        <g class="node n1">
          <circle cx="252" cy="120" r="7"/>
          <rect class="chip-rect" x="96" y="98" width="136" height="44" rx="22"/>
          <text class="chip-text" x="164" y="126" text-anchor="middle">resume drop</text>
        </g>
        <g class="node n2">
          <circle cx="838" cy="120" r="7"/>
          <rect class="chip-rect" x="858" y="98" width="118" height="44" rx="22"/>
          <text class="chip-text" x="917" y="126" text-anchor="middle">referrals</text>
        </g>
        <g class="node n3">
          <circle cx="322" cy="190" r="7"/>
          <rect class="chip-rect" x="128" y="168" width="174" height="44" rx="22"/>
          <text class="chip-text" x="215" y="196" text-anchor="middle">interview prep</text>
        </g>
        <g class="node n4">
          <circle cx="768" cy="190" r="7"/>
          <rect class="chip-rect" x="788" y="168" width="102" height="44" rx="22"/>
          <text class="chip-text" x="839" y="196" text-anchor="middle">offers</text>
        </g>
      </svg>
    </div>
  </main>

</body>
</html>
