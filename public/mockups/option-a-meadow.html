<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline · Option A · Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sprout: #53B72A;
    --sprout-deep: #3E9B1F;
    --lime: #A6E17A;
    --fern: #1C4A12;
    --paper: #F7FBF2;
    --radius-pill: 999px;
    --radius-card: 24px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Nunito Sans", sans-serif;
    color: var(--fern);
    background: var(--paper);
    overflow: hidden;
    position: relative;
  }

  /* ---------- drifting meadow blobs ---------- */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 {
    width: 55vw; height: 55vw;
    left: -15vw; top: -20vw;
    background: radial-gradient(circle, #C9EFA4 0%, rgba(201,239,164,0) 70%);
    animation: drift-1 26s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 48vw; height: 48vw;
    right: -12vw; top: 10vh;
    background: radial-gradient(circle, var(--lime) 0%, rgba(166,225,122,0) 70%);
    opacity: 0.75;
    animation: drift-2 32s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 46vw; height: 46vw;
    left: 8vw; bottom: -18vw;
    background: radial-gradient(circle, #E3F7A6 0%, rgba(227,247,166,0) 70%);
    animation: drift-3 24s ease-in-out infinite alternate;
  }
  .blob-4 {
    width: 30vw; height: 30vw;
    right: 12vw; bottom: -8vw;
    background: radial-gradient(circle, rgba(83,183,42,0.45) 0%, rgba(83,183,42,0) 70%);
    animation: drift-1 36s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift-1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, 4vh) scale(1.12); } }
  @keyframes drift-2 { from { transform: translate(0, 0) scale(1.05); } to { transform: translate(-5vw, 6vh) scale(0.95); } }
  @keyframes drift-3 { from { transform: translate(0, 0); } to { transform: translate(7vw, -4vh) scale(1.08); } }

  /* ---------- floating pill nav ---------- */
  nav {
    position: fixed;
    top: 22px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(83, 183, 42, 0.18);
    border-radius: var(--radius-pill);
    padding: 8px 10px 8px 16px;
    box-shadow: 0 8px 28px rgba(28, 74, 18, 0.10);
    max-width: calc(100vw - 32px);
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--sprout-deep);
    margin-right: 10px;
    white-space: nowrap;
  }
  .nav-brand svg { width: 24px; height: 26px; }
  .nav-links { display: flex; gap: 2px; }
  .nav-links a {
    text-decoration: none;
    color: var(--fern);
    font-weight: 600;
    font-size: 14.5px;
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    transition: background 0.18s ease, color 0.18s ease;
  }
  .nav-links a:hover { background: rgba(166, 225, 122, 0.35); }
  .nav-links a:focus-visible,
  .btn:focus-visible {
    outline: 3px solid var(--sprout);
    outline-offset: 2px;
  }
  .nav-join {
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: #fff;
    background: var(--sprout);
    border: none;
    border-radius: var(--radius-pill);
    padding: 9px 18px;
    cursor: pointer;
    margin-left: 6px;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .nav-join:hover { background: var(--sprout-deep); transform: translateY(-1px); }

  /* ---------- hero ---------- */
  main {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
    gap: 22px;
  }
  .hero-mark { width: 92px; height: 100px; }
  .hero-mark .leaf-l { transform-origin: 60px 38px; animation: sway 5s ease-in-out infinite alternate; }
  .hero-mark .leaf-r { transform-origin: 62px 44px; animation: sway 6s ease-in-out infinite alternate-reverse; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }

  h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: clamp(64px, 12vw, 132px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--sprout);
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
  h1 .dot { color: var(--lime); }

  .tagline {
    font-size: clamp(16px, 2.2vw, 20px);
    font-weight: 600;
    color: var(--fern);
    max-width: 460px;
    opacity: 0.85;
  }

  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .btn {
    font-family: "Nunito Sans", sans-serif;
    font-weight: 700;
    font-size: 17px;
    border-radius: var(--radius-pill);
    padding: 15px 32px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .btn-join {
    color: #fff;
    background: var(--sprout);
    border: none;
    box-shadow: 0 10px 24px rgba(83, 183, 42, 0.35);
  }
  .btn-join:hover { background: var(--sprout-deep); transform: translateY(-2px); box-shadow: 0 14px 30px rgba(83, 183, 42, 0.4); }
  .btn-learn {
    color: var(--fern);
    background: rgba(255, 255, 255, 0.75);
    border: 2px solid rgba(28, 74, 18, 0.22);
  }
  .btn-learn:hover { border-color: var(--sprout); color: var(--sprout-deep); transform: translateY(-2px); }

  .schools {
    position: absolute;
    bottom: 28px;
    display: flex;
    gap: 10px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  .schools span {
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(83, 183, 42, 0.2);
    color: var(--sprout-deep);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
  }

  @media (max-width: 620px) {
    .nav-links { display: none; }
    .nav-brand { margin-right: 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .hero-mark .leaf-l, .hero-mark .leaf-r { animation: none; }
    .btn, .nav-join { transition: none; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8FD460"/>
        <stop offset="1" stop-color="#4DAE2A"/>
      </linearGradient>
      <symbol id="sprout-mark" viewBox="0 0 120 130">
        <g class="roots" fill="none" stroke="#A6E17A" stroke-width="7" stroke-linecap="round">
          <path d="M60 78 H106"/>
          <path d="M60 78 V96 L46 112"/>
          <path d="M60 96 L76 106"/>
          <path d="M60 78 L38 90"/>
        </g>
        <g fill="#A6E17A">
          <circle cx="110" cy="78" r="5"/>
          <circle cx="43" cy="115" r="5"/>
          <circle cx="79" cy="108" r="5"/>
          <circle cx="34" cy="92" r="5"/>
        </g>
        <path d="M60 40 V78" fill="none" stroke="#53B72A" stroke-width="11" stroke-linecap="round"/>
        <path class="leaf-l" d="M60 40 C57 24 48 10 30 5 C32 23 44 36 60 40 Z" fill="url(#leafGrad)"/>
        <path class="leaf-r" d="M62 46 C70 33 85 25 103 27 C96 42 80 50 62 46 Z" fill="#8FD460"/>
      </symbol>
    </defs>
  </svg>

  <nav>
    <div class="nav-brand">
      <svg><use href="#sprout-mark"/></svg>
      The Pipeline
    </div>
    <div class="nav-links">
      <a href="#">About</a>
      <a href="#">Portals</a>
      <a href="#">Opportunities</a>
    </div>
    <button class="nav-join">Join</button>
  </nav>

  <main>
    <svg class="hero-mark"><use href="#sprout-mark"/></svg>
    <h1>Pipeline<span class="dot">.</span></h1>
    <p class="tagline">The student network that routes you from classroom to career. Grown by students, for students.</p>
    <div class="cta-row">
      <a class="btn btn-join" href="#">Join the Pipeline</a>
      <a class="btn btn-learn" href="#">Learn more</a>
    </div>
    <div class="schools">
      <span>UCI</span><span>UCLA</span><span>UCR</span>
    </div>
  </main>

</body>
</html>
