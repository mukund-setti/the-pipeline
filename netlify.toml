# Netlify config for The Pipeline (static Astro build).
# Connect the repo in Netlify and it auto-detects Astro; this pins the essentials.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the fingerprinted assets Astro emits under /_astro/.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
